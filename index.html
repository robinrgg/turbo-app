<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Turbo App - Aquascop</title>
<meta name="theme-color" content="#0b1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turbo">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./shared/tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: var(--font-sans);
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex; flex-direction: column;
}

header {
  padding: 22px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.brand {
  font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  display: flex; align-items: center; gap: 11px;
}
/* Logo truite (SVG en ligne, fond transparent) */
.brand .mark { display: block; height: 27px; width: auto; flex-shrink: 0; }
.brand .accent { color: var(--accent); }
.sub {
  font-family: var(--font-mono); font-size: .72rem; color: var(--text-mute);
  margin-top: 5px; letter-spacing: .5px;
}

main { flex: 1; padding: 18px 16px 28px; max-width: 760px; width: 100%; margin: 0 auto; }
.grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
}

.card {
  position: relative; display: flex; flex-direction: column; gap: 3px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--app-accent, var(--accent));
  border-radius: var(--radius);
  padding: 16px 16px 15px;
  min-height: 92px;
  text-decoration: none; color: inherit;
  transition: background .15s, border-color .15s, transform .06s;
}
.card:hover { background: var(--surface-2); border-color: var(--border-strong); }
.card:active { transform: scale(.985); }

.card .top { display: flex; align-items: center; gap: 10px; }
.card .ico {
  width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: color-mix(in srgb, var(--app-accent, var(--accent)) 16%, transparent);
}
.card .ico.has-img { background: none; }
.card .ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .nom { font-size: 1.02rem; font-weight: 700; letter-spacing: .2px; }
.card .desc { font-size: .82rem; color: var(--text-dim); margin-top: 2px; }

.badge {
  position: absolute; top: 12px; right: 12px;
  font-family: var(--font-mono); font-size: .6rem; letter-spacing: .5px;
  padding: 3px 7px; border-radius: 20px; text-transform: uppercase;
  border: 1px solid var(--border-strong); color: var(--text-mute);
}
.badge.online { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

footer {
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .68rem; color: var(--text-mute);
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
#net { display: inline-flex; align-items: center; gap: 6px; }
#net .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
#net.off .dot { background: var(--text-mute); }
</style>
</head>
<body>

<header>
  <div class="brand"><svg class="mark" viewBox="0 150 512 216" width="64" height="27" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56c2b1"/><stop offset="1" stop-color="#3a8a7e"/></linearGradient></defs><path d="M-72,220 H48" stroke="#56c2b1" stroke-width="14" stroke-linecap="round" opacity=".9"/><path d="M-112,256 H48" stroke="#3a8a7e" stroke-width="18" stroke-linecap="round" opacity=".9"/><path d="M-72,292 H48" stroke="#56c2b1" stroke-width="14" stroke-linecap="round" opacity=".9"/><path d="M-32,326 H48" stroke="#2a5e57" stroke-width="10" stroke-linecap="round" opacity=".9"/><path d="M470,262 C455,228 408,202 340,196 C270,190 205,206 160,228 C140,238 125,246 112,250 L112,274 C126,280 145,290 170,298 C220,314 290,322 350,316 C412,310 458,290 470,262 Z" fill="url(#tg)"/><path d="M268,200 L292,152 Q318,160 330,196 Z" fill="#3a8a7e"/><path d="M188,222 Q196,196 214,212 Z" fill="#3a8a7e"/><path d="M210,302 L204,338 Q226,336 244,310 Z" fill="#3a8a7e"/><path d="M290,314 L284,346 Q304,340 318,314 Z" fill="#3a8a7e"/><path d="M122,254 L60,196 Q84,262 60,330 L122,272 Z" fill="url(#tg)"/><path d="M384,286 Q360,318 344,332 Q376,326 398,298 Z" fill="#2f756a"/><path d="M392,214 Q404,254 388,300" fill="none" stroke="#2f756a" stroke-width="6" stroke-linecap="round"/><circle cx="250" cy="232" r="7" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="300" cy="226" r="6" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="346" cy="240" r="7" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="218" cy="256" r="6" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="278" cy="262" r="6" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="330" cy="272" r="5" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="184" cy="244" r="5" fill="#d9524a" stroke="#e6e8ea" stroke-width="3"/><circle cx="236" cy="216" r="4.5" fill="#1f4f48"/><circle cx="320" cy="214" r="4.5" fill="#1f4f48"/><circle cx="368" cy="226" r="4.5" fill="#1f4f48"/><circle cx="262" cy="246" r="4.5" fill="#1f4f48"/><circle cx="428" cy="244" r="11" fill="#0b1014"/><circle cx="431" cy="241" r="3.5" fill="#e6e8ea"/><path d="M470,264 L446,270" stroke="#0b1014" stroke-width="5" stroke-linecap="round"/></svg><span>Turbo<span class="accent">App</span></span></div>
  <div class="sub">Aquascop - Outils terrain</div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span id="net"><span class="dot"></span><span id="net-label">En ligne</span></span>
  <span id="version">v-</span>
</footer>

<script src="./apps.js"></script>
<script>
// ---- Rendu des cartes depuis le registre
const grid = document.getElementById('grid');
(self.APPS || []).forEach(app => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `./apps/${app.slug}/`;
  a.style.setProperty('--app-accent', app.accent);

  // Icône : image si chemin de fichier / data-URI / URL, sinon emoji de repli
  const ic = app.icone || '';
  const estImage = /^(\.?\/|data:|https?:)/.test(ic) || /\.(svg|png|jpe?g|webp|ico)$/i.test(ic);
  const icoHTML = estImage
    ? `<span class="ico has-img"><img src="${ic}" alt="" loading="lazy"></span>`
    : `<span class="ico">${ic || '▦'}</span>`;

  a.innerHTML = `
    <span class="badge ${app.offline ? '' : 'online'}">${app.offline ? 'hors-ligne' : 'en ligne'}</span>
    <div class="top">
      ${icoHTML}
      <span class="nom">${app.nom}</span>
    </div>
    <span class="desc">${app.desc || ''}</span>`;
  grid.appendChild(a);
});

// ---- Indicateur réseau
const net = document.getElementById('net'), netLabel = document.getElementById('net-label');
function majReseau() {
  const on = navigator.onLine;
  net.classList.toggle('off', !on);
  netLabel.textContent = on ? 'En ligne' : 'Hors ligne';
}
window.addEventListener('online', majReseau);
window.addEventListener('offline', majReseau);
majReseau();

// ---- Version (lue depuis le cache actif du service worker)
if ('caches' in window) {
  caches.keys().then(keys => {
    const c = keys.find(k => k.startsWith('turbo-'));
    if (c) document.getElementById('version').textContent = c;
  }).catch(() => {});
}

// ---- Enregistrement du service worker racine
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW racine enregistré, scope:', reg.scope))
      .catch(err => console.warn('SW échec:', err));
  });
}
</script>
</body>
</html>
